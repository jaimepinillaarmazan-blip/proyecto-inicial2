<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alertas Tempranas - USM</title>
    
    <!-- Cargamos los estilos de Leaflet para el mapa -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Conectamos nuestro propio archivo de estilos -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>

    <header>
        <h1>Plataforma de Riesgos Urbanos - Casa Central USM</h1>
        <p>Reporta y visualiza obstáculos o incidentes en los alrededores de la universidad.</p>
    </header>

    <main>
        <!-- Este es el contenedor donde aparecerá el mapa interactivo -->
        <div id="mapa-usm"></div>
        
        <!-- Botones debajo del mapa -->
        <div style="display: flex; gap: 15px; margin-top: 10px;">
            <button id="btn-reportar" class="btn-principal">Reportar Nuevo Incidente</button>
            <button id="btn-abrir-dashboard" class="btn-secundario">Ver Últimos 25 Reportes</button>
        </div>
    </main>

    <!-- Dashboard Lateral Desplegable -->
    <div id="dashboard-lateral">
        <div class="dashboard-header">
            <h3>Últimos Reportes</h3>
            <button id="btn-cerrar-dashboard">✖</button>
        </div>
        <div id="lista-reportes">
            <!-- JavaScript inyectará las tarjetas de reportes aquí -->
        </div>
    </div>

    <!-- Contenedor del formulario emergente (Debe ir ANTES de los scripts) -->
    <div id="modal-reporte" class="oculto">
        <div class="modal-contenido">
            <h2>Detalles del Incidente</h2>
            
            <label for="tipo-incidente">Tipo de problema:</label>
            <select id="tipo-incidente">
                <option value="Obstáculo en vía">Obstáculo en la vía</option>
                <option value="Problema de Iluminación">Problema de Iluminación</option>
                <option value="Actividad Sospechosa">Actividad Sospechosa</option>
                <option value="Daño en Infraestructura">Daño en Infraestructura</option>
            </select>

            <label for="desc-incidente">Descripción breve:</label>
            <textarea id="desc-incidente" rows="3" placeholder="Ej: Escalones sueltos cerca de la entrada..."></textarea>

            <label for="duracion-incidente">¿Cuánto tiempo estará activo?</label>
            <select id="duracion-incidente">
                <option value="1">1 Hora</option>
                <option value="6">6 Horas</option>
                <option value="12">12 Horas</option>
                <option value="24">24 Horas</option>
            </select>

            <div class="modal-botones">
                <button id="btn-cancelar" class="btn-secundario">Cancelar</button>
                <button id="btn-enviar" class="btn-principal">Guardar Reporte</button>
            </div>
        </div>
    </div>

    <!-- Cargamos la lógica de Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Conectamos nuestro propio archivo JavaScript al final -->
    <script src="{{ url_for('static', filename='js/mapa.js') }}"></script>

</body>
</html>
